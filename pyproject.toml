[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills-marketplace"
version = "0.1.0"
description = "A small, Agent Skills-compatible marketplace and installer."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "agent-skills contributors"}
]

[project.scripts]
skills = "agent_skills_marketplace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

